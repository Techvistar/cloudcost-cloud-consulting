<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background cloud outline - Teal/Green -->
  <path d="M 135 180 Q 100 180 100 210 Q 100 240 135 240 L 265 240 Q 310 240 310 195 Q 310 160 280 160 Q 270 140 245 140 Q 220 120 190 120 Q 150 120 135 180 Z" 
        stroke="#10B981" stroke-width="20" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Background cloud outline - Orange (left) -->
  <path d="M 85 230 Q 50 230 50 260 Q 50 290 85 290 L 120 290 Q 100 280 100 260 Q 100 240 120 230 Z" 
        stroke="#F97316" stroke-width="18" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Background cloud outline - Blue (right) -->
  <path d="M 340 160 Q 400 160 420 190 Q 430 220 420 250 L 380 250 Q 390 230 390 200 Q 390 170 350 170 Z" 
        stroke="#0EA5E9" stroke-width="18" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Trend arrow - Orange -->
  <g transform="translate(200, 220) rotate(-45)">
    <line x1="0" y1="60" x2="0" y2="0" stroke="#F97316" stroke-width="16" stroke-linecap="round"/>
    <polygon points="0,0 -15,-25 0,-15 15,-25" fill="#F97316"/>
  </g>
  
  <!-- Bar chart - Orange bar -->
